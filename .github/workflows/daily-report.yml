name: Generate Daily Ryan Report

on:
  workflow_dispatch:

  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Ryan Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: node scripts/generate-report.mjs

      - name: Commit updated report
        run: |
          git config user.name "Ryan Report Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/report.json
          git diff --cached --quiet || git commit -m "Generate daily Ryan Report"
          git push